name: Backup and production monitor

on:
  schedule:
    - cron: "*/15 * * * *"       # health check co 15 min
    - cron: "17 2 * * *"         # backup codziennie o 04:17 PL latem / 03:17 UTC
  workflow_dispatch:

jobs:
  monitor:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Check production readiness
        env:
          HEALTH_URL: https://www.asystentdekoracji.pl/api/health
        run: |
          set -eu
          body="$(curl --fail-with-body --silent --show-error --max-time 20 "$HEALTH_URL")"
          echo "$body"
          echo "$body" | grep -q '"ok":true'

  backup:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 2 * * *'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export Supabase tables
        env:
          SB_URL: ${{ secrets.SB_URL }}
          SB_SERVICE_KEY: ${{ secrets.SB_SERVICE_KEY }}
          BACKUP_DIR: backup
          BACKUP_TABLES: ${{ vars.BACKUP_TABLES }}
        run: python scripts/db_backup.py

      - name: Encrypt backup with AES-256
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -eu
          test -n "$BACKUP_PASSPHRASE"
          tar -czf backup.tar.gz backup
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 \
            --output backup.tar.gz.gpg backup.tar.gz
          rm -rf backup backup.tar.gz

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: backup.tar.gz.gpg
          retention-days: 30

      - name: Upload encrypted backup to Backblaze B2 EU
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_ID: ${{ secrets.B2_BUCKET_ID }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          BACKUP_FILE: backup.tar.gz.gpg
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/b2_backup.py

      - name: Controlled restore test (download + decrypt + validate only)
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_FILE_NAME: supabase/${{ github.repository }}/${{ github.run_id }}/backup.tar.gz.gpg
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: python scripts/b2_restore_test.py
