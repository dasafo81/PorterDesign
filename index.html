<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8"/>
  <script>
    // Ustawia data-theme na <html> PRZED pierwszym malowaniem strony,
    // zeby przy starcie nie mrugnal domyslny (jasny) motyw przed przelaczeniem na zapisany.
    (function(){
      try{
        var t=localStorage.getItem("pd_theme");
        if(t==="dark"||t==="beige")document.documentElement.setAttribute("data-theme",t);
      }catch(e){}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#1a1a2e"/>
  <link rel="canonical" href="https://asystentdekoracji.pl/"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Porter Design"/>
  <link rel="manifest" href="/manifest.json"/>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <title>Porter Design Assistant</title>
</head>
<body>
  <div id="root">
    <div class="app-inner">
      <div id="app-mount"></div>
    </div>
    <div style="text-align:center;padding:0.8rem 1rem 1.4rem;font-size:8px;color:var(--t3);letter-spacing:0.18em;text-transform:uppercase;border-top:0.5px solid var(--bd3);opacity:0.6;margin-top:auto;">
      Created by Porter Design &nbsp;·&nbsp;
      <span id="app-version" style="cursor:pointer;text-decoration:underline;text-underline-offset:2px;" title="Historia zmian">v1.3.4</span>
    </div>
  </div>

  <!-- CHANGELOG MODAL -->
  <div id="changelog-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9999;align-items:center;justify-content:center;">
    <div style="background:var(--bg2,#1e1e2e);border:1px solid var(--bd2,#333);border-radius:16px;max-width:480px;width:90%;max-height:80vh;overflow-y:auto;padding:2rem;position:relative;box-shadow:0 8px 40px rgba(0,0,0,0.5);">
      <button id="changelog-close" style="position:absolute;top:1rem;right:1rem;background:none;border:none;color:var(--t2,#aaa);font-size:1.4rem;cursor:pointer;line-height:1;">×</button>
      <h2 style="margin:0 0 1.5rem;font-size:1rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--t1,#eee);">Historia zmian</h2>
      <div id="changelog-body" style="font-size:0.82rem;line-height:1.7;color:var(--t2,#ccc);"></div>
    </div>
  </div>

  <script>
    var CHANGELOG = [
      {
        version: "v1.3.4",
        date: "2026-07-10",
        items: [
          "Przelacznik motywu: jasny / ciemny / bezowy (na razie: chrome aplikacji — topbar, zakladki, tlo; ekrany wewnetrzne w trakcie konwersji)",
          "Ekran blokady dostepu po wygasnieciu okresu probnego / anulowaniu subskrypcji, z wyborem planu"
        ]
      },
      {
        version: "v1.3.3",
        date: "2026-06-01",
        items: [
          "PDF Wycena Uproszczona: przywrocono dzialajaca wersje z 28.05 + nowa paleta kolorow (3 linijki montazu)"
        ]
      },
      {
        version: "v1.3.2",
        date: "2026-06-01",
        items: [
          "Poprawka: montaż w PDF (Wycena + Wycena uproszczona) czytany z odpornym fallbackiem"
        ]
      },
      {
        version: "v1.3.1",
        date: "2026-06-01",
        items: [
          "Wycena uproszczona: PDF pokazuje montaż, łącznie bez montażu i łącznie z montażem",
          "Wymuszone odświeżanie bundla (no-cache na index.html)"
        ]
      },
      {
        version: "v1.3.0",
        date: "2026-04-30",
        items: [
          "Nowy moduł CRM — tablica Kanban z etapami sprzedaży i zarządzaniem szansami",
          "Nowy moduł Mail — szablony wiadomości e-mail z podglądem i autouzupełnianiem danych klienta",
          "Poprawka: crash modułu Mail (brak importu roundTo10)",
          "Usunięto logi diagnostyczne z modułu CRM"
        ]
      },
      {
        version: "v1.2.0",
        date: "2026-04-01",
        items: [
          "System wariantów A/B/C — alternatywne opcje w oknie, nie sumowane",
          "Duplikowanie produktów jednym kliknięciem",
          "Modalne potwierdzenia destruktywnych akcji (usuwanie, zmiana typu)",
          "Prowizja polecenia (%) stosowana per produkt z zaokrągleniem do 10 zł"
        ]
      },
      {
        version: "v1.1.0",
        date: "2026-03-01",
        items: [
          "Generowanie PDF: pełna wycena, uproszczona wycena, zamówienie tkanin, zamówienie szycia",
          "Produkt 'Inny' — pozycja niestandardowa z ręczną ceną",
          "Szyny elektryczne i standardowe jako oddzielny typ produktu",
          "Zaokrąglanie cen do najbliższych 10 zł"
        ]
      },
      {
        version: "v1.0.0",
        date: "2026-02-01",
        items: [
          "Pierwsze wydanie aplikacji Porter Design Assistant",
          "Zarządzanie klientami: dane, pokoje, okna, produkty",
          "Typy produktów: zasłony, rolety, żaluzje",
          "Integracja z Supabase i wdrożenie na Vercel"
        ]
      }
    ];

    function renderChangelog() {
      var html = "";
      CHANGELOG.forEach(function(entry) {
        html += "<div style=\"margin-bottom:1.4rem;\">";
        html += "<div style=\"display:flex;align-items:baseline;gap:0.6rem;margin-bottom:0.5rem;\">";
        html += "<span style=\"font-weight:700;color:var(--accent,#a78bfa);font-size:0.9rem;\">" + entry.version + "</span>";
        html += "<span style=\"font-size:0.72rem;color:var(--t3,#888);\">" + entry.date + "</span>";
        html += "</div>";
        html += "<ul style=\"margin:0;padding-left:1.2rem;\">";
        entry.items.forEach(function(item) {
          html += "<li style=\"margin-bottom:0.25rem;\">" + item + "</li>";
        });
        html += "</ul></div>";
      });
      document.getElementById("changelog-body").innerHTML = html;
    }

    document.addEventListener("DOMContentLoaded", function() {
      var overlay = document.getElementById("changelog-overlay");
      var closeBtn = document.getElementById("changelog-close");
      var versionSpan = document.getElementById("app-version");

      renderChangelog();

      versionSpan.addEventListener("click", function() {
        overlay.style.display = "flex";
      });
      closeBtn.addEventListener("click", function() {
        overlay.style.display = "none";
      });
      overlay.addEventListener("click", function(e) {
        if (e.target === overlay) overlay.style.display = "none";
      });
    });
  </script>

  <script>
    // Straznik bialego ekranu: dziala niezaleznie od Reacta, wiec lapie tez
    // bledy, ktorych ErrorBoundary nie widzi (nieudane pobranie glownego bundla,
    // blad przy starcie modulu, iOS ubijajacy strone w tle).
    (function(){
      function log(msg){
        try{ localStorage.setItem("pd_last_error", new Date().toISOString()+" | "+String(msg).slice(0,300)); }catch(e){}
      }
      window.addEventListener("error",function(e){
        var t=e&&e.target;
        if(t&&t.tagName==="SCRIPT") log("Nie zaladowano skryptu: "+(t.src||""));
        else log((e&&e.message)||"error");
      },true);
      window.addEventListener("unhandledrejection",function(e){
        var r=e&&e.reason; log("Promise: "+((r&&(r.message||r))||"?"));
      });
      function isEmpty(){
        var m=document.getElementById("app-mount");
        return !m||!m.firstElementChild;
      }
      function reloadOnce(){
        try{
          var last=+sessionStorage.getItem("pd_chunk_reload")||0;
          if(Date.now()-last<30000) return false;
          sessionStorage.setItem("pd_chunk_reload",String(Date.now()));
        }catch(e){}
        location.reload(); return true;
      }
      function showFallback(){
        if(document.getElementById("pd-fallback")) return;
        var last=""; try{ last=localStorage.getItem("pd_last_error")||""; }catch(e){}
        var d=document.createElement("div");
        d.id="pd-fallback";
        d.style.cssText="position:fixed;inset:0;z-index:10000;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;font-family:Montserrat,sans-serif;";
        d.innerHTML='<div style="font-size:15px;font-weight:700;color:#222">Aplikacja nie wystartowa\u0142a</div>'+
          '<button onclick="location.reload()" style="padding:10px 22px;border-radius:8px;border:none;background:#7c3aed;color:#fff;font-size:13px;font-weight:700">Od\u015bwie\u017c aplikacj\u0119</button>'+
          '<div style="font-size:10px;color:#999;max-width:420px;word-break:break-word"></div>';
        d.lastChild.textContent=last;
        document.body.appendChild(d);
      }
      function check(){
        if(!isEmpty()){ var f=document.getElementById("pd-fallback"); if(f) f.remove(); return; }
        log("Pusty ekran (app-mount bez tresci)");
        if(!reloadOnce()) showFallback();
      }
      window.addEventListener("load",function(){ setTimeout(check,8000); });
      document.addEventListener("visibilitychange",function(){
        if(document.visibilityState==="visible") setTimeout(check,1500);
      });
      window.addEventListener("pageshow",function(){ setTimeout(check,1500); });
    })();
  </script>

  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
